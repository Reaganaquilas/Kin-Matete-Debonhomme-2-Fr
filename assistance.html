<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assistance aux Réunions</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background: #f1f4f6;
      color: #1f2937;
    }
    .card {
      border-radius: 16px;
      border: 1px solid #e5ebf3;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
    }
    .summary-card {
      border-radius: 14px;
      background: #ffffff;
      padding: 1rem;
      border: 1px solid #e5ebf3;
    }
    .summary-label {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #6b7280;
    }
    .summary-value {
      font-size: 1.25rem;
      font-weight: 700;
      color: #214b63;
      margin-top: 0.2rem;
    }
    .badge-trend {
      display: inline-block;
      padding: 0.35rem 0.65rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
    }
    .badge-up, .badge-down, .badge-equal { background: #eef2f5; color: #214b63; }
  </style>
  <link rel="stylesheet" href="app-theme.css">
  <script src="vendor/supabase.js"></script>
  <script src="auth-config.js"></script>
  <script src="sync-engine.js"></script>
  <script src="auth-guard.js"></script>
</head>
<body>
  <div class="container py-4">
    <h2 class="mb-4">Assistance aux Réunions</h2>

    <div class="card p-3 mb-4">
      <div class="row g-3 align-items-end">
        <div class="col-md-3">
          <label class="form-label">Période</label>
          <select id="periodType" class="form-select" onchange="togglePeriodInputs()">
            <option value="month">Mois précis</option>
            <option value="last3">3 derniers mois</option>
            <option value="last6">6 derniers mois</option>
            <option value="serviceYear">Année de service</option>
            <option value="year">Année normale</option>
          </select>
        </div>
        <div class="col-md-3" id="monthWrapper">
          <label class="form-label">Mois sélectionné</label>
          <input id="monthPicker" type="month" class="form-control" />
        </div>
        <div class="col-md-3 d-none" id="serviceYearWrapper">
          <label class="form-label">Année de service</label>
          <select id="serviceYearSelect" class="form-select"></select>
        </div>
        <div class="col-md-3 d-none" id="endMonthWrapper">
          <label class="form-label">Fin de période</label>
          <input id="endMonthPicker" type="month" class="form-control" />
        </div>
        <div class="col-md-3">
          <button class="btn btn-primary w-100" onclick="refreshAllSummary()">Mettre à jour</button>
        </div>
      </div>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-md-3">
        <div class="summary-card">
          <div class="summary-label">Moyenne semaine</div>
          <div class="summary-value" id="avgWeek">0</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="summary-card">
          <div class="summary-label">Moyenne week-end</div>
          <div class="summary-value" id="avgWeekend">0</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="summary-card">
          <div class="summary-label">Moyenne mémorial</div>
          <div class="summary-value" id="avgMemorial">0</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="summary-card">
          <div class="summary-label">Évolution</div>
          <div class="summary-value" id="trendMessage">--</div>
        </div>
      </div>
    </div>

    <div class="card p-3 mb-4">
      <canvas id="assistChart"></canvas>
    </div>

    <ul class="nav nav-tabs mb-3" id="attendanceTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="week-tab" data-access-feature="assistance:week" data-bs-toggle="tab" data-bs-target="#week" type="button" role="tab">Réunions de la semaine</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="weekend-tab" data-access-feature="assistance:weekend" data-bs-toggle="tab" data-bs-target="#weekend" type="button" role="tab">Réunion du Week-end</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="memorial-tab" data-access-feature="assistance:memorial" data-bs-toggle="tab" data-bs-target="#memorial" type="button" role="tab">Mémorial</button>
      </li>
    </ul>

    <div class="tab-content">
      <div class="tab-pane fade show active" id="week" role="tabpanel">
        <div class="card p-3">
          <h5 class="mb-3">Réunions de la semaine</h5>
          <div class="row g-3 mb-3">
            <div class="col-md-4">
              <label class="form-label">Mois</label>
              <input id="weekMonth" type="month" class="form-control" onchange="renderWeekRows()" />
            </div>
            <div class="col-md-4">
              <label class="form-label">Nombre de semaines</label>
              <input id="weekCount" type="number" class="form-control" min="1" max="8" value="4" onchange="renderWeekRows()" />
            </div>
          </div>
          <div id="weekRows"></div>
          <button class="btn btn-success mt-3" onclick="saveWeekAttendance()">Enregistrer l’assistance</button>
          <div class="table-responsive mt-4">
            <table class="table table-sm table-striped mb-0">
              <thead class="table-light">
                <tr><th>Date</th><th>Assistants</th><th>Action</th></tr>
              </thead>
              <tbody id="weekRecordsBody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="tab-pane fade" id="weekend" role="tabpanel">
        <div class="card p-3">
          <h5 class="mb-3">Réunion du Week-end</h5>
          <div class="row g-3 mb-3">
            <div class="col-md-4">
              <label class="form-label">Mois</label>
              <input id="weekendMonth" type="month" class="form-control" onchange="renderWeekendRows()" />
            </div>
            <div class="col-md-4">
              <label class="form-label">Nombre de réunions</label>
              <input id="weekendCount" type="number" class="form-control" min="1" max="8" value="4" onchange="renderWeekendRows()" />
            </div>
          </div>
          <div id="weekendRows"></div>
          <button class="btn btn-success mt-3" onclick="saveWeekendAttendance()">Enregistrer l’assistance</button>
          <div class="table-responsive mt-4">
            <table class="table table-sm table-striped mb-0">
              <thead class="table-light">
                <tr><th>Date</th><th>Assistants</th><th>Action</th></tr>
              </thead>
              <tbody id="weekendRecordsBody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="tab-pane fade" id="memorial" role="tabpanel">
        <div class="card p-3">
          <h5 class="mb-3">Mémorial</h5>
          <div class="row g-3 mb-3">
            <div class="col-md-3">
              <label class="form-label">Mois</label>
              <input id="memorialMonth" type="month" class="form-control" />
            </div>
            <div class="col-md-3">
              <label class="form-label">Date</label>
              <input id="memorialDate" type="date" class="form-control" />
            </div>
            <div class="col-md-3">
              <label class="form-label">Année</label>
              <input id="memorialYear" type="number" class="form-control" min="2020" value="2026" />
            </div>
            <div class="col-md-3">
              <label class="form-label">Nombre d’assistants</label>
              <input id="memorialAttendance" type="number" class="form-control" min="0" value="0" />
            </div>
          </div>
          <button class="btn btn-success" onclick="saveMemorialAttendance()">Enregistrer l’assistance</button>
          <div class="table-responsive mt-4">
            <table class="table table-sm table-striped mb-0">
              <thead class="table-light">
                <tr><th>Date</th><th>Année</th><th>Assistants</th><th>Action</th></tr>
              </thead>
              <tbody id="memorialRecordsBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const currentDate = new Date();
    const currentYear = currentDate.getFullYear();
    const currentMonthKey = `${currentYear}-${String(currentDate.getMonth() + 1).padStart(2, '0')}`;
    const months = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
    let db;
    let attendanceRecords = [];
    let assistChart = null;

    function openDatabase() {
      const request = indexedDB.open('AssistanceDB', 2);
      request.onupgradeneeded = event => {
        const database = event.target.result;
        if (!database.objectStoreNames.contains('attendance')) {
          database.createObjectStore('attendance', { keyPath: 'id' });
        }
      };
      request.onsuccess = event => {
        db = event.target.result;
        initializePage();
      };
      request.onerror = () => console.error('Impossible d’ouvrir la base de données');
    }

    function getObjectStore(name, mode = 'readonly') {
      return db.transaction(name, mode).objectStore(name);
    }

    function initializePage() {
      document.getElementById('monthPicker').value = currentMonthKey;
      document.getElementById('weekMonth').value = currentMonthKey;
      document.getElementById('weekendMonth').value = currentMonthKey;
      document.getElementById('memorialMonth').value = currentMonthKey;
      document.getElementById('endMonthPicker').value = currentMonthKey;
      populateServiceYearSelect();
      togglePeriodInputs();
      renderWeekRows();
      renderWeekendRows();
      loadAttendance();
      createChart();
    }

    function populateServiceYearSelect() {
      const select = document.getElementById('serviceYearSelect');
      const years = [];
      for (let year = currentYear - 3; year <= currentYear + 1; year++) {
        years.push(year);
      }
      select.innerHTML = years.map(year => `<option value="${year}">${year}</option>`).join('');
      select.value = currentYear;
    }

    function togglePeriodInputs() {
      const type = document.getElementById('periodType').value;
      document.getElementById('monthWrapper').classList.toggle('d-none', type !== 'month');
      document.getElementById('serviceYearWrapper').classList.toggle('d-none', type !== 'serviceYear');
      document.getElementById('endMonthWrapper').classList.toggle('d-none', type !== 'last3' && type !== 'last6');
      refreshAllSummary();
    }

    function formatMonthKey(monthKey) {
      const [year, month] = monthKey.split('-').map(Number);
      return `${months[month - 1]} ${year}`;
    }

    function getMonthRange(monthKey) {
      const [year, month] = monthKey.split('-').map(Number);
      return {
        start: new Date(year, month - 1, 1),
        end: new Date(year, month, 0)
      };
    }

    function getServiceYearRange(serviceYear) {
      return {
        start: new Date(serviceYear - 1, 8, 1),
        end: new Date(serviceYear, 7, 31)
      };
    }

    function getSelectedRange() {
      const type = document.getElementById('periodType').value;
      if (type === 'serviceYear') {
        const year = Number(document.getElementById('serviceYearSelect').value);
        return getServiceYearRange(year);
      }
      if (type === 'last3' || type === 'last6') {
        const count = type === 'last3' ? 3 : 6;
        const endMonth = document.getElementById('endMonthPicker').value || currentMonthKey;
        const [year, month] = endMonth.split('-').map(Number);
        const end = new Date(year, month, 0);
        const start = new Date(year, month - 1, 1);
        start.setMonth(start.getMonth() - (count - 1));
        return { start, end };
      }
      if (type === 'year') {
        const year = Number(document.getElementById('monthPicker').value.split('-')[0]);
        return { start: new Date(year, 0, 1), end: new Date(year, 11, 31) };
      }
      return getMonthRange(document.getElementById('monthPicker').value || currentMonthKey);
    }

    function getPreviousRange() {
      const current = getSelectedRange();
      const duration = (current.end - current.start) / (1000 * 60 * 60 * 24 * 30);
      const prevEnd = new Date(current.start);
      prevEnd.setDate(prevEnd.getDate() - 1);
      const prevStart = new Date(current.start);
      prevStart.setMonth(prevStart.getMonth() - Math.max(1, Math.round(duration)));
      return { start: prevStart, end: prevEnd };
    }

    function dateToKey(dateString) {
      return dateString;
    }

    function filterRecordsByRange(records, range) {
      return records.filter(record => {
        const recordDate = new Date(record.dateKey);
        return recordDate >= range.start && recordDate <= range.end;
      });
    }

    function getTypeAverage(type, records, range) {
      const filtered = filterRecordsByRange(records.filter(item => item.type === type), range);
      if (!filtered.length) return 0;
      const total = filtered.reduce((sum, item) => sum + Number(item.attendees || 0), 0);
      return Number((total / filtered.length).toFixed(1));
    }

    function getTrendMessage(current, previous) {
      if (!previous) return 'Aucune donnée précédente';
      const delta = current - previous;
      if (delta > 0) return `L’assistance a augmenté de ${Math.abs(delta).toFixed(1)} par rapport à la période précédente.`;
      if (delta < 0) return `L’assistance a diminué de ${Math.abs(delta).toFixed(1)} par rapport à la période précédente.`;
      return 'L’assistance est stable par rapport à la période précédente.';
    }

    function refreshAllSummary() {
      const range = getSelectedRange();
      const previousRange = getPreviousRange();
      const weekRecords = filterRecordsByRange(attendanceRecords.filter(item => item.type === 'week'), range);
      const weekendRecords = filterRecordsByRange(attendanceRecords.filter(item => item.type === 'weekend'), range);
      const memorialRecords = filterRecordsByRange(attendanceRecords.filter(item => item.type === 'memorial'), range);
      const prevWeek = getTypeAverage('week', attendanceRecords, previousRange);
      const prevWeekend = getTypeAverage('weekend', attendanceRecords, previousRange);
      const prevMemorial = getTypeAverage('memorial', attendanceRecords, previousRange);
      const currentWeek = getTypeAverage('week', attendanceRecords, range);
      const currentWeekend = getTypeAverage('weekend', attendanceRecords, range);
      const currentMemorial = getTypeAverage('memorial', attendanceRecords, range);

      document.getElementById('avgWeek').textContent = currentWeek.toFixed(1);
      document.getElementById('avgWeekend').textContent = currentWeekend.toFixed(1);
      document.getElementById('avgMemorial').textContent = currentMemorial.toFixed(1);

      const overallAverage = ((currentWeek + currentWeekend + currentMemorial) / 3).toFixed(1);
      document.getElementById('trendMessage').textContent = `${overallAverage} en moyenne`;

      if (assistChart) {
        assistChart.data.datasets[0].data = [currentWeek, currentWeekend, currentMemorial];
        assistChart.data.labels = ['Semaine', 'Week-end', 'Mémorial'];
        assistChart.update();
      }

      renderRecords('week', weekRecords);
      renderRecords('weekend', weekendRecords);
      renderRecords('memorial', memorialRecords);
    }

    function renderRecords(type, records) {
      const body = document.getElementById(type === 'week' ? 'weekRecordsBody' : type === 'weekend' ? 'weekendRecordsBody' : 'memorialRecordsBody');
      if (!records.length) {
        body.innerHTML = '<tr><td colspan="3" class="text-center">Aucune donnée enregistrée.</td></tr>';
        return;
      }
      body.innerHTML = records.map(record => `
        <tr>
          <td>${record.dateLabel}</td>
          <td>${record.attendees}</td>
          <td><button class="btn btn-sm btn-outline-danger" onclick="deleteAttendance('${record.id}')">Supprimer</button></td>
        </tr>
      `).join('');
    }

    function createChart() {
      const ctx = document.getElementById('assistChart');
      assistChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: ['Semaine', 'Week-end', 'Mémorial'],
          datasets: [{
            label: 'Moyenne d’assistance',
            data: [0, 0, 0],
            backgroundColor: ['#0d6efd', '#198754', '#ffc107']
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } }
        }
      });
    }

    function getDatesForMonth(monthKey, weekday, count) {
      const [year, month] = monthKey.split('-').map(Number);
      const dates = [];
      const daysInMonth = new Date(year, month, 0).getDate();
      for (let day = 1; day <= daysInMonth; day++) {
        const date = new Date(year, month - 1, day);
        if (date.getDay() === weekday) {
          dates.push(date);
        }
      }
      return dates.slice(0, count).map(date => toInputDate(date));
    }

    function toInputDate(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function renderWeekRows() {
      const monthKey = document.getElementById('weekMonth').value || currentMonthKey;
      const count = Number(document.getElementById('weekCount').value || 4);
      const dates = getDatesForMonth(monthKey, 5, count);
      const container = document.getElementById('weekRows');
      container.innerHTML = dates.map((date, index) => `
        <div class="row g-2 mb-2">
          <div class="col-md-6">
            <label class="form-label">Date vendredi ${index + 1}</label>
            <input type="date" class="form-control" id="weekDate${index}" value="${date}" />
          </div>
          <div class="col-md-6">
            <label class="form-label">Nombre d’assistants</label>
            <input type="number" class="form-control" id="weekAtt${index}" min="0" value="0" />
          </div>
        </div>
      `).join('');
    }

    function renderWeekendRows() {
      const monthKey = document.getElementById('weekendMonth').value || currentMonthKey;
      const count = Number(document.getElementById('weekendCount').value || 4);
      const dates = getDatesForMonth(monthKey, 0, count);
      const container = document.getElementById('weekendRows');
      container.innerHTML = dates.map((date, index) => `
        <div class="row g-2 mb-2">
          <div class="col-md-6">
            <label class="form-label">Date dimanche ${index + 1}</label>
            <input type="date" class="form-control" id="weekendDate${index}" value="${date}" />
          </div>
          <div class="col-md-6">
            <label class="form-label">Nombre d’assistants</label>
            <input type="number" class="form-control" id="weekendAtt${index}" min="0" value="0" />
          </div>
        </div>
      `).join('');
    }

    function saveWeekAttendance() {
      const rows = Array.from(document.querySelectorAll('#weekRows .row')).map((row, index) => ({
        date: document.getElementById(`weekDate${index}`)?.value,
        attendees: document.getElementById(`weekAtt${index}`)?.value || 0
      })).filter(item => item.date);
      const store = getObjectStore('attendance', 'readwrite');
      rows.forEach(row => {
        const id = `week_${row.date}`;
        const request = store.put({ id, type: 'week', dateKey: row.date, dateLabel: formatDisplayDate(row.date), attendees: Number(row.attendees || 0) });
        request.onsuccess = () => loadAttendance();
      });
      refreshAllSummary();
    }

    function saveWeekendAttendance() {
      const rows = Array.from(document.querySelectorAll('#weekendRows .row')).map((row, index) => ({
        date: document.getElementById(`weekendDate${index}`)?.value,
        attendees: document.getElementById(`weekendAtt${index}`)?.value || 0
      })).filter(item => item.date);
      const store = getObjectStore('attendance', 'readwrite');
      rows.forEach(row => {
        const id = `weekend_${row.date}`;
        const request = store.put({ id, type: 'weekend', dateKey: row.date, dateLabel: formatDisplayDate(row.date), attendees: Number(row.attendees || 0) });
        request.onsuccess = () => loadAttendance();
      });
      refreshAllSummary();
    }

    function saveMemorialAttendance() {
      const month = document.getElementById('memorialMonth').value;
      const date = document.getElementById('memorialDate').value || `${document.getElementById('memorialYear').value || currentYear}-${month.split('-')[1]}-01`;
      const attendees = Number(document.getElementById('memorialAttendance').value || 0);
      const store = getObjectStore('attendance', 'readwrite');
      const request = store.put({
        id: `memorial_${date}`,
        type: 'memorial',
        dateKey: date,
        dateLabel: formatDisplayDate(date),
        attendees
      });
      request.onsuccess = () => loadAttendance();
      refreshAllSummary();
    }

    function formatDisplayDate(dateString) {
      const date = new Date(dateString + 'T00:00:00');
      return `${String(date.getDate()).padStart(2, '0')}/${String(date.getMonth() + 1).padStart(2, '0')}/${date.getFullYear()}`;
    }

    function loadAttendance() {
      const store = getObjectStore('attendance');
      const request = store.getAll();
      request.onsuccess = () => {
        attendanceRecords = request.result || [];
        refreshAllSummary();
      };
    }

    function deleteAttendance(id) {
      const store = getObjectStore('attendance', 'readwrite');
      const request = store.delete(id);
      request.onsuccess = () => loadAttendance();
    }

    window.addEventListener('DOMContentLoaded', () => {
      openDatabase();
    });
  </script>
</body>
</html>
