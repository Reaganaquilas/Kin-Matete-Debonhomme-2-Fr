<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion des tâches - IndexedDB + Supabase</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="app-theme.css">
  <script src="vendor/supabase.js"></script>
  <script src="auth-config.js"></script>
  <script src="sync-engine.js"></script>
  <script src="auth-guard.js"></script>
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="card shadow-lg">
      <div class="card-header bg-primary text-white">
        <h2 class="mb-0">Application de gestion des tâches</h2>
      </div>
      <div class="card-body">
        <div class="input-group mb-3">
          <input id="taskInput" type="text" class="form-control" placeholder="Nouvelle tâche...">
          <button class="btn btn-primary" onclick="addTask()">Ajouter</button>
          <button class="btn btn-outline-primary" onclick="fetchFromSupabase()">Charger depuis Supabase</button>
        </div>
        <ul id="taskList" class="list-group"></ul>
      </div>
      <div class="card-footer text-muted">
        Données stockées en local (IndexedDB) et synchronisées en ligne (Supabase).
      </div>
    </div>

    <!-- Zone de notifications -->
    <div id="alertBox" class="mt-3"></div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // ⚙️ IndexedDB setup
    let db;
    const request = indexedDB.open("GestionDB", 1);
    request.onupgradeneeded = event => {
      db = event.target.result;
      db.createObjectStore("tasks", { keyPath: "id", autoIncrement: true });
    };
    request.onsuccess = event => {
      db = event.target.result;
      loadTasks();
      syncTasks(); // synchro au démarrage
    };

    // ➕ Ajouter une tâche
    async function addTask() {
      const input = document.getElementById("taskInput");
      if (!input.value.trim()) {
        showAlert("Veuillez entrer une tâche.", "warning");
        return;
      }
      const task = { text: input.value.trim(), synced: false };
      const tx = db.transaction("tasks", "readwrite");
      tx.objectStore("tasks").add(task);
      tx.oncomplete = () => {
        input.value = "";
        loadTasks();
        syncTasks();
        showAlert("Tâche ajoutée localement. Synchronisation en cours...", "info");
      };
    }

    // 📖 Charger les tâches locales
    function loadTasks() {
      const tx = db.transaction("tasks", "readonly");
      const store = tx.objectStore("tasks");
      const request = store.getAll();
      request.onsuccess = () => {
        const list = document.getElementById("taskList");
        list.innerHTML = "";
        request.result.forEach(t => {
          const li = document.createElement("li");
          li.className = "list-group-item d-flex justify-content-between align-items-center";
          li.textContent = t.text;
          const badge = document.createElement("span");
          badge.className = "badge rounded-pill " + (t.synced ? "bg-success" : "bg-warning text-dark");
          badge.textContent = t.synced ? "En ligne" : "Local";
          li.appendChild(badge);
          list.appendChild(li);
        });
      };
    }

    // 🔄 Synchroniser avec Supabase (local → en ligne)
    async function syncTasks() {
      await window.appSync?.syncNow("tâches");
      loadTasks();
    }

    // 📥 Charger depuis Supabase vers IndexedDB (en ligne → local)
    async function fetchFromSupabase() {
      await window.appSync?.syncNow("chargement des tâches");
      loadTasks();
      showAlert("Tâches actualisées.", "success");
    }

    // 🔔 Afficher une notification Bootstrap
    function showAlert(message, type) {
      const alertBox = document.getElementById("alertBox");
      alertBox.innerHTML = `
        <div class="alert alert-${type} alert-dismissible fade show" role="alert">
          ${message}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      `;
    }
  </script>
</body>
</html>
